<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cidade Bus Jam</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d2b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{--ink:#1b2a55;--line:#0d1630;--panel:#243b7a;--panel2:#2f4a9a;--gold:#ffd23f}
html,body{margin:0}
body{font-family:'Press Start 2P',ui-monospace,monospace;font-size:10px;line-height:1.6;color:#fff;min-height:100vh;display:flex;justify-content:center;background:linear-gradient(#4db8ff 0%,#9fdcff 55%,#d7f3ff 100%) fixed;overflow-x:hidden;touch-action:manipulation}
img,canvas{image-rendering:crisp-edges;image-rendering:pixelated}
#app{position:relative;z-index:2;width:100%;max-width:480px;padding:12px 14px 100px}
.hidden{display:none!important}
.cloud{position:fixed;z-index:1;left:-200px;pointer-events:none;animation:drift linear infinite}
@keyframes drift{to{transform:translateX(calc(100vw + 400px))}}

.top{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:10px}
.pill{background:var(--ink);border:3px solid var(--line);box-shadow:0 3px 0 var(--line);padding:6px 9px;display:flex;align-items:center;gap:6px;min-height:34px;white-space:nowrap}
.pill.hard{background:#a3162f}
.pill img{height:16px;width:auto}
.bump{animation:bump .25s steps(3)}
@keyframes bump{50%{scale:1.18}}
.progRow{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.prog{flex:1;height:16px;background:var(--ink);border:3px solid var(--line)}
.prog i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#7cff6b 0 6px,#4fd13f 6px 8px);transition:width .3s steps(6)}
.cm{display:flex;align-items:center;gap:5px;background:var(--ink);border:3px solid var(--line);padding:3px 7px;font-size:9px}
.cm img{height:18px;width:auto}

#boardWrap{position:relative;margin:0 auto;width:max-content;padding:8px;background:#d9c08a;border:4px solid var(--line);box-shadow:0 6px 0 var(--line),inset 0 0 0 3px #efdca8}
#boardWrap.mag{box-shadow:0 6px 0 var(--line),0 0 0 4px #4db8ff,inset 0 0 0 3px #efdca8}
#board{position:relative;overflow:hidden;background-size:100% 100%}
#board.fever{animation:feverb 1.2s ease-in-out infinite}
@keyframes feverb{50%{box-shadow:inset 0 0 0 4px #4dd2ff}}
.shake{animation:wshake .35s}
@keyframes wshake{0%,100%{translate:0 0}20%{translate:-6px 2px}40%{translate:6px -2px}60%{translate:-4px 2px}80%{translate:4px -1px}}
#combo{display:none;position:absolute;top:-16px;right:-4px;z-index:5;background:#1fae62;color:#fff;border:3px solid var(--line);padding:5px 8px;font-size:9px;box-shadow:0 3px 0 var(--line)}
#combo.pop{animation:cpop .25s steps(3)}
@keyframes cpop{50%{scale:1.3}}

.piece{position:absolute;background-size:100% 100%;cursor:pointer;transition:transform .5s cubic-bezier(.55,.05,.95,.45);animation:pop .35s backwards;will-change:transform}
@keyframes pop{from{scale:0;opacity:0}60%{scale:1.12}}
.piece:active{scale:.93}
.piece.fixed{cursor:default}
.piece.bad{animation:bad .4s}
@keyframes bad{20%{translate:-5px 0}40%{translate:5px 0}60%{translate:-4px 0}80%{translate:4px 0}}
.piece.flash{animation:flash .5s}
@keyframes flash{30%,70%{filter:brightness(2.2) saturate(.2)}}
.piece.hint{animation:pulse .6s steps(2) infinite}
@keyframes pulse{50%{filter:brightness(1.8)}}

.pws,.row{display:flex;gap:8px;justify-content:center}
.pws{margin-top:16px}
.row{margin-top:12px}
.btn{font:inherit;font-size:9px;color:var(--ink);background:var(--gold);border:3px solid var(--line);box-shadow:inset 0 -4px 0 #c9971a,0 4px 0 var(--line);padding:11px 10px;cursor:pointer;text-transform:uppercase}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -2px 0 #c9971a,0 1px 0 var(--line)}
.btn.sec{background:#8ab4ff;box-shadow:inset 0 -4px 0 #5b86d6,0 4px 0 var(--line)}
.btn.sec:active{box-shadow:inset 0 -2px 0 #5b86d6,0 1px 0 var(--line)}
.btn:disabled{filter:grayscale(1);opacity:.6;cursor:default}
.btn.wide{width:100%}
.pw{display:flex;align-items:center;gap:6px;flex:1;justify-content:center}
.pw img{height:16px;width:auto}
.pw.on{outline:3px solid #fff}
.help{color:var(--ink);font-size:8px;line-height:1.9;text-align:center;margin:18px 4px 0}

.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:center;background:var(--ink);border-top:4px solid var(--line)}
.tabs div{display:flex;width:100%;max-width:480px}
.tabs button{position:relative;flex:1;font:inherit;font-size:8px;padding:18px 2px;background:none;border:0;color:#9db4ff;cursor:pointer}
.tabs button.on{background:var(--panel);color:#fff;box-shadow:inset 0 4px 0 var(--gold)}
.tabs button[data-dot="1"]::after{content:'!';position:absolute;top:8px;right:10%;background:#ff3b5c;color:#fff;padding:2px 5px;font-size:8px;border:2px solid var(--line);animation:bump .8s steps(2) infinite}

.title{justify-content:center;margin:2px auto 14px;width:max-content;font-size:11px}
.card{background:var(--ink);border:3px solid var(--line);box-shadow:0 3px 0 var(--line);padding:12px;margin-bottom:12px;font-size:9px}
.card b{font-size:10px;color:var(--gold)}
.sub{font-size:7px;color:#9db4ff;margin-top:4px;line-height:1.7}
.ch{display:flex;align-items:center;gap:10px}
.ch .grow{flex:1}
.ch>img{height:34px;width:auto}
.ch2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.ptier{display:flex;gap:3px;margin-top:8px}.pt{flex:1;height:10px;background:#0d1630;border:2px solid var(--line)}.pt.on{background:#ffd23f}.pt.cl{background:#4caf50}.pt.big{flex:1.6}
.mbar{height:12px;background:#0d1630;border:2px solid var(--line);margin-top:6px}
.mbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,#ffd23f 0 6px,#e0a91c 6px 8px)}
.mis{margin-top:12px;padding-top:10px;border-top:2px dashed #3a4a7a}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
.day{position:relative;background:#101c42;border:2px solid var(--line);padding:6px 2px;text-align:center;font-size:7px;min-height:56px}
.day img{display:block;height:20px;width:auto;margin:4px auto}
.day.cur{border-color:var(--gold);animation:pulseb .8s steps(2) infinite}
@keyframes pulseb{50%{background:#26397a}}
.day.done{opacity:.55}
.day em{position:absolute;top:1px;right:2px;color:#7cff6b;font-style:normal;font-size:6px}

.cityWrap{margin:0 auto 14px;width:max-content;padding:8px;background:#d9c08a;border:4px solid var(--line);box-shadow:0 6px 0 var(--line),inset 0 0 0 3px #efdca8}
.cityWrap canvas{display:block}
.shop{display:flex;align-items:center;gap:10px;background:var(--ink);border:3px solid var(--line);box-shadow:0 3px 0 var(--line);padding:8px 10px;margin-bottom:10px;font-size:9px}
.shop>img{width:40px;height:40px;background:#58b368;border:2px solid var(--line)}
.shop .nm{flex:1}
.shop .nm small{display:block;font-size:7px;color:#9db4ff;margin-top:4px}
.shop .btn{display:flex;align-items:center;gap:6px;padding:9px 8px}
.shop .btn img{width:auto;height:14px;background:none;border:0}

.overlay{position:fixed;inset:0;background:#0d1630cc;display:none;align-items:center;justify-content:center}
#ov{z-index:70}#chOv{z-index:75}
.box{background:var(--panel);border:4px solid var(--line);box-shadow:0 6px 0 var(--line),inset 0 0 0 4px var(--panel2);padding:22px 16px;text-align:center;width:86%;max-width:340px;animation:boxin .3s steps(4)}
@keyframes boxin{from{scale:.5;opacity:0}}
.box h2{margin:0 0 12px;font-size:13px;color:var(--gold);line-height:1.5}
.box p{font-size:9px;line-height:1.9;margin:12px 0 6px;white-space:pre-line}
.box .btn{display:block;width:100%;margin-top:12px}
.stars{display:flex;justify-content:center;gap:8px}
.stars:empty{display:none}
.stars img{height:32px;width:auto;animation:pop .4s backwards}
#chImg{width:96px;height:auto;display:block;margin:6px auto 14px}
.shakeChest{animation:shk .12s steps(2) infinite}
@keyframes shk{0%{rotate:-6deg}100%{rotate:6deg}}
.ritem{display:flex;align-items:center;gap:10px;background:#101c42;border:3px solid;padding:8px 10px;margin:8px 0;text-align:left;animation:pop .3s backwards;font-size:10px}
.ritem img{height:24px;width:auto}

#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:80}
.ft{position:fixed;z-index:90;pointer-events:none;font-size:11px;white-space:nowrap;text-shadow:2px 2px 0 var(--line);transform:translateX(-50%);animation:ft .9s steps(9) forwards}
@keyframes ft{to{translate:0 -52px;opacity:0}}
.fc{position:fixed;z-index:85;width:24px;height:24px;pointer-events:none;transition:transform .6s cubic-bezier(.4,0,.9,.6)}

.reg{color:var(--ink);font-size:8px;text-align:center;margin:-2px 0 8px;letter-spacing:1px}
.piece.spin{animation:spin .3s}
@keyframes spin{50%{scale:.8;rotate:8deg}}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.sk{background:#101c42;border:3px solid;padding:8px 4px;text-align:center;font-size:7px;cursor:pointer;line-height:1.5}
.sk img{width:64px;height:32px;display:block;margin:0 auto 6px}
.sk.lock img{filter:brightness(0) opacity(.5)}
.sk.eq{box-shadow:0 0 0 3px #fff}
.lm{display:flex;gap:8px;margin-top:6px}
.lm img{width:40px;height:40px;background:#58b368;border:2px solid var(--line)}
.lm img.off{filter:brightness(0) opacity(.45)}
.pv{display:block;max-width:100%;margin:0 auto 8px;border:3px solid var(--line)}

.tip{display:none;background:#fff8d6;color:var(--ink);border:3px solid var(--line);box-shadow:0 3px 0 var(--line);padding:8px 10px;font-size:8px;line-height:1.7;text-align:center;margin:0 0 10px}
#hand{display:none;position:fixed;z-index:60;width:36px;pointer-events:none;animation:bob .6s steps(2) infinite}
@keyframes bob{50%{translate:0 8px}}
#banner{position:fixed;left:0;right:0;top:34%;z-index:65;text-align:center;pointer-events:none;display:none}
#banner span{display:inline-block;background:#a3162f;color:#fff;border:4px solid var(--line);box-shadow:0 5px 0 var(--line);padding:12px 16px;font-size:12px;line-height:1.7}
#banner.show{display:block;animation:bn 2s steps(20) forwards}
@keyframes bn{0%{translate:-120% 0}15%{translate:0 0}80%{translate:0 0}100%{translate:120% 0;opacity:0}}
#setOv{z-index:72}
.sky{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin-top:10px}
.sky img{width:36px;height:36px;background:#58b368;border:2px solid var(--line);animation:pop .4s backwards}
#setBody .btn{margin-top:8px}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="app">
  <div id="gameView">
    <div class="top">
      <div class="pill" id="lvl"></div>
      <div class="pill" id="lives"></div>
      <div class="pill" id="coinPill"><img id="coinImg" alt=""><span id="coinTxt">0</span></div>
    </div>
    <div id="regLbl" class="reg"></div>
    <div id="tip" class="tip"></div>
    <div class="progRow">
      <div class="prog"><i id="progBar"></i></div>
      <div class="cm"><img id="cmImg" alt=""><span id="cmTxt">0/3</span></div>
    </div>
    <div id="boardWrap"><div id="combo"></div><div id="board"></div></div>
    <div class="pws">
      <button class="btn sec pw" id="pwMagnet"></button>
      <button class="btn sec pw" id="pwHeart"></button>
    </div>
    <div class="row">
      <button class="btn" id="hintBtn">Dica (AD)</button>
      <button class="btn sec" id="resetBtn">Reiniciar</button>
      <button class="btn sec" id="muteBtn" style="display:none">Som</button>
      <button class="btn sec" id="cfgBtn">Config</button>
      <button class="btn" id="backBtn" style="display:none">Campanha</button>
    </div>
    <p class="help" id="help">Toque nos ônibus para tirá-los da rua. Se bater em algo, você perde um coração!</p>
  </div>
  <div id="rewView" class="hidden"></div>
  <div id="colView" class="hidden"></div>
  <div id="cityView" class="hidden">
    <div class="pill title">Minha cidade</div>
    <div class="cityWrap" id="cityWrap"></div>
    <div id="cityInfo"></div>
    <div id="shop"></div>
  </div>
</div>
<div class="tabs"><div>
  <button id="tabGame" class="on">Jogar</button>
  <button id="tabRew">Prêmios</button>
  <button id="tabCity">Cidade</button>
  <button id="tabCol">Coleção</button>
</div></div>
<div class="overlay" id="ov"><div class="box"><h2 id="ovT"></h2><div class="stars" id="ovS"></div><div class="sky" id="ovK"></div><p id="ovP"></p><button class="btn" id="ovB"></button><button class="btn sec" id="ovB2"></button></div></div>
<div class="overlay" id="setOv"><div class="box"><h2>Configurações</h2><div id="setBody"></div><button class="btn" id="setClose">Fechar</button></div></div>
<img id="hand" alt="">
<div id="banner"><span id="bannerTxt"></span></div>
<div class="overlay" id="chOv"><div class="box"><h2 id="chT"></h2><img id="chImg" alt=""><div id="chItems"></div><button class="btn" id="chBtn">Coletar</button></div></div>

<script>
const $=id=>document.getElementById(id);
const C=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const R=(g,x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
const pick=a=>a[Math.random()*a.length|0];
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));
  return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function patt(rows,map){
  const h=rows.length,w=rows[0].length,c=C(w,h),g=c.getContext('2d');
  rows.forEach((row,y)=>[...row].forEach((ch,x)=>{if(map[ch])R(g,x,y,1,1,map[ch])}));
  return c.toDataURL();
}

/* ---------- sprites ---------- */
const HEART=[".XX.XX.","XWXXXXX","XXXXXXX",".XXXXX.","..XXX..","...X..."];
const STAR=["....Y....","...YYY...","YYYYYYYYY",".YYYYYYY.","..YYYYY..","..YYYYY..",".YYY.YYY.",".YY...YY."];
const IMG={
  heart:patt(HEART,{X:'#ff3b5c',W:'#ffb3c1'}),
  heart0:patt(HEART,{X:'#3a4a7a',W:'#4a5a8a'}),
  star:patt(STAR,{Y:'#ffd23f'}),
  star0:patt(STAR,{Y:'#3a4a7a'}),
  coin:patt(["..DDDD..",".DYYYYD.","DYWWYYYD","DYWYYYYD","DYYYYYYD","DYYYYYYD",".DYYYYD.","..DDDD.."],{D:'#b8860b',Y:'#ffd23f',W:'#fff8c4'}),
  magnet:patt(["..XXXX..",".XXXXXX.","XX....XX","XX....XX","RR....BB","RR....BB","RR....BB","WW....WW"],{X:'#aab3c7',R:'#e63946',B:'#2f6fe0',W:'#ffffff'}),
  chest:patt(["..XXXXXXXX..",".XBBBBBBBBX.","XBBBBBBBBBBX","XGGGGGGGGGGX","XBBBBYYBBBBX","XBBBBYYBBBBX","XBBBBBBBBBBX","XXXXXXXXXXXX"],{X:'#4a2a0c',B:'#a56a2a',G:'#ffd23f',Y:'#fff3a0'}),
  cloud:(()=>{const c=C(24,10),g=c.getContext('2d');R(g,4,4,16,5,'#fff');R(g,2,6,20,3,'#fff');R(g,7,2,6,3,'#fff');R(g,13,1,5,4,'#fff');R(g,2,8,20,1,'#d6ecff');R(g,4,9,16,1,'#d6ecff');return c.toDataURL()})(),
  cone:(()=>{const c=C(16,16),g=c.getContext('2d');R(g,3,13,10,2,'#5a2a0a');R(g,7,2,2,2,'#ff8a1f');R(g,6,4,4,3,'#ff8a1f');R(g,5,7,6,3,'#ff8a1f');R(g,4,10,8,3,'#ff8a1f');R(g,6,5,4,1,'#fff');R(g,5,8,6,1,'#fff');R(g,7,3,1,1,'#ffc27a');return c.toDataURL()})()
};
const ICON={coins:IMG.coin,magnet:IMG.magnet,heart:IMG.heart,chest:IMG.chest};

const SPR={};
function decoSkin(g,W,skin,cx){
  const r=(...a)=>R(g,...a);
  if(skin==='pizza'){[[5,9],[8,5],[W-12,5],[W-11,9]].forEach(([x,y])=>{r(x,y,2,2,'#b3261e');r(x,y,1,1,'#e0534a')})}
  else if(skin==='nave'){r(2,12,W-4,1,'#4de3ff');r(0,5,1,6,'#4de3ff')}
  else if(skin==='retro'){r(2,11,W-4,2,'#f2e6c9');r(2,3,W-4,1,'#ffffff')}
  else if(skin==='neon'){r(1,2,W-2,1,'#00ffd5');r(1,13,W-2,1,'#ff2bd6');r(1,3,1,10,'#00ffd5')}
  else if(skin==='candango'){r(2,11,W-4,1,'#8b5a2b');r(W/2-1,2,2,1,'#2e7d32');r(3,6,1,3,'#fff')}
  else if(skin==='cataratas'){for(let i=0;i<5;i++)r(3+i*Math.floor((W-8)/5),12,2,1,'#fff');r(2,3,W-4,1,'#e1f5fe')}
  else if(skin==='ouro'){r(2,3,W-4,1,'#fff3a0');r(2,12,W-4,1,'#b8860b');r(1,7,1,2,'#fff3a0');r(W-2,7,1,2,'#fff3a0')}
  else if(skin==='doce'){
    const cs=['#ffffff','#6ec6ff','#ffd23f','#7cff6b'];
    for(let i=0;i<8;i++){const x=5+((i*7)%(W-14)),y=4+((i*3)%7);if(x>=cx-4&&x<=cx+4&&y>=5&&y<=10)continue;r(x,y,1,1,cs[i%4])}
  }
}
function bus(len,d,h,color,kind,tag,skin){
  kind=kind||'';skin=skin||'';tag=tag||'';
  const key=[len,d,h,color,kind,tag,skin].join('|');if(SPR[key])return SPR[key];
  const W=16*len,H=16,c=C(W,H),g=c.getContext('2d');
  const dark=shade(color,-.5),mid=shade(color,-.18),lite=shade(color,.3);
  const roofC=kind==='vip'?'#ffd23f':shade(color,.2);
  [[3,0],[3,14],[W-8,0],[W-8,14]].forEach(([x,y])=>R(g,x,y,5,2,'#161a26'));
  R(g,1,2,W-2,12,dark);
  g.clearRect(1,2,1,1);g.clearRect(W-2,2,1,1);g.clearRect(1,13,1,1);g.clearRect(W-2,13,1,1);
  R(g,2,3,W-4,10,color);R(g,2,11,W-4,2,mid);R(g,2,3,W-4,1,lite);
  R(g,4,5,W-13,6,roofC);R(g,4,5,W-13,1,kind==='vip'?'#fff3a0':lite);
  const cx=Math.floor((4+W-9)/2)+1;
  if(kind==='vip'){R(g,6,6,1,1,'#fff');R(g,W-11,9,1,1,'#fff');R(g,W-14,6,1,1,'#fff')}
  else if(kind==='school'){
    R(g,2,4,W-4,1,'#1a1a1a');R(g,2,11,W-4,1,'#1a1a1a');R(g,4,5,5,5,'#1a1a1a');
    if(tag.charAt(0)==='~'){
      const DG={1:['010','110','010','010','111'],2:['111','001','111','100','111'],3:['111','001','111','001','111']}[+tag.slice(1)]||['111','101','101','101','111'];
      DG.forEach((row,yy)=>[...row].forEach((ch,xx)=>{if(ch==='1')R(g,5+xx,5+yy,1,1,'#fff')}));
    }else R(g,5,6,3,3,tag||'#fff');
  }
  else if(kind==='broken'){R(g,W-12,5,4,6,'#3a3f52');R(g,W-11,6,1,1,'#ffb300');R(g,W-10,9,1,1,'#ffb300');R(g,6,5,1,5,'#e63946');R(g,4,7,5,1,'#e63946')}
  else if(kind==='flip'){R(g,5,6,4,4,'#4de3ff');R(g,6,7,2,2,'#14305c')}
  if(skin&&!kind)decoSkin(g,W,skin,cx);
  const ac_=kind==='vip'?'#2f2f46':kind==='school'?'#222':'#fff';

  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);
}

/* ---------- lógica do puzzle ---------- */
const COLORS=['#e63946','#2a9d8f','#f4a261','#8e6cef','#06a6d4','#e76f9a','#7cb518','#9aa7ff'];
function cellsOf(p){const a=[];for(let i=0;i<p.len;i++)a.push(p.h?[p.x+i,p.y]:[p.x,p.y+i]);return a}
function pathDir(p,d){
  const a=[];
  if(p.h){if(d>0)for(let x=p.x+p.len;x<N;x++)a.push([x,p.y]);else for(let x=0;x<p.x;x++)a.push([x,p.y])}
  else{if(d>0)for(let y=p.y+p.len;y<N;y++)a.push([p.x,y]);else for(let y=0;y<p.y;y++)a.push([p.x,y])}
  return a;
}
const pathCells=p=>pathDir(p,p.d);
function canMove(p,list){
  const occ=new Set();
  list.forEach(q=>{if(q!==p)cellsOf(q).forEach(c=>occ.add(c[0]+','+c[1]))});
  const ok=d=>pathDir(p,d).every(c=>!occ.has(c[0]+','+c[1]));
  return p.kind==='flip'?(ok(1)||ok(-1)):ok(p.d);
}
function freeList(rest,fx){
  const all=rest.concat(fx);
  return rest.filter(p=>{
    if(!canMove(p,all))return false;
    if(!p.grp)return true;
    const m=rest.find(q=>q.grp===p.grp&&q!==p);
    return !m||canMove(m,all);
  });
}
function rounds(list){
  let rest=list.filter(p=>!p.fixed);const fx=list.filter(p=>p.fixed);let r=0;
  while(rest.length){
    const fl=freeList(rest,fx);
    if(!fl.length)return Infinity;
    rest=rest.filter(p=>!fl.includes(p));r++;
  }
  return r;
}
const solvable=list=>rounds(list)!==Infinity;
function fallbackLevel(){
  return [
    {x:0,y:0,len:2,h:true,d:1,color:COLORS[0],ci:0},
    {x:3,y:0,len:2,h:false,d:1,color:COLORS[1],ci:1},
    {x:0,y:2,len:2,h:true,d:1,color:COLORS[2],ci:2},
    {x:1,y:3,len:2,h:false,d:1,color:COLORS[3],ci:3}
  ];
}
function addSpecials(list,level,rnd){
  const mv=list.filter(p=>!p.fixed);
  const pv=level>=4?.12:0,pb=level>=8?.12:0,pf=level>=16?.10:0;
  mv.forEach(p=>{const x=rnd();if(x<pv)p.kind='vip';else if(x<pv+pb)p.kind='broken';else if(x<pv+pb+pf)p.kind='flip'});
  const pairs=level>=30?2:level>=12?1:0;
  const pool=mv.filter(p=>!p.kind);
  for(let g=0;g<pairs;g++){
    for(let a=0;a<60;a++){
      const x=pool[(rnd()*pool.length)|0],y=pool[(rnd()*pool.length)|0];
      if(!x||!y||x===y||x.kind||y.kind)continue;
      const px=new Set(pathCells(x).map(c=>c.join(','))),py=new Set(pathCells(y).map(c=>c.join(',')));
      if(cellsOf(y).some(c=>px.has(c.join(',')))||cellsOf(x).some(c=>py.has(c.join(','))))continue;
      x.kind=y.kind='school';x.grp=y.grp=g+1;x.tag=y.tag=['#ff3b5c','#4db8ff','#7cff6b'][g];break;
    }
  }
  if(!solvable(list)){
    list.forEach(p=>{if(p.kind==='flip')p.kind=undefined});
    if(!solvable(list))list.forEach(p=>{if(p.kind==='school'){p.kind=undefined;p.grp=undefined;p.tag=undefined}});
  }
  return list;
}
function gen(level,rnd=Math.random){
  N=Math.min(5+Math.floor((level-1)/4),8);
  const hard=level%5===0;
  const nObs=level>=6?Math.min(1+Math.floor((level-6)/4),5):0;
  const count=Math.min(4+level+(hard?2:0),Math.floor(N*N*0.3));
  const wantRounds=Math.min(2+Math.floor(level/5),6);
  let best=null,bestScore=-1;
  for(let t=0;t<120;t++){
    const list=[],occ=new Set();
    for(let i=0;i<nObs;i++){
      const x=Math.floor(rnd()*N),y=Math.floor(rnd()*N),k=x+','+y;
      if(occ.has(k))continue;occ.add(k);list.push({x,y,len:1,h:true,d:1,fixed:true});
    }
    let buses=0,fails=0;
    while(buses<count&&fails<250){
      const h=rnd()<.5,len=rnd()<.6?2:3;
      const x=Math.floor(rnd()*(h?N-len+1:N)),y=Math.floor(rnd()*(h?N:N-len+1));
      const ci=buses%COLORS.length;
      const p={x,y,len,h,d:rnd()<.5?1:-1,color:COLORS[ci],ci};
      const cs=cellsOf(p).map(c=>c.join(','));
      if(cs.some(c=>occ.has(c))){fails++;continue}
      list.push(p);
      if(!solvable(list)){list.pop();fails++;continue}
      cs.forEach(c=>occ.add(c));buses++;
    }
    if(buses<Math.max(4,Math.ceil(count*.8)))continue;
    const r=rounds(list);
    if(r===Infinity||r<2)continue;
    const score=Math.min(r,wantRounds)*100+buses;
    if(score>bestScore){bestScore=score;best=list}
    if(r>=wantRounds&&buses>=count-1)return addSpecials(list,level,rnd);
  }
  return best?addSpecials(best,level,rnd):fallbackLevel();
}
function firstBlocker(p){
  const m=new Map();
  pieces.forEach(q=>{if(q!==p)cellsOf(q).forEach(c=>m.set(c[0]+','+c[1],q))});
  const path=pathCells(p);if(p.d<0)path.reverse();
  for(const c of path){const q=m.get(c[0]+','+c[1]);if(q)return q}
  return null;
}

function blockerFor(p){
  let q=firstBlocker(p);if(q)return q;
  if(p.grp){const m=pieces.find(x=>x.grp===p.grp&&x!==p);if(m){q=firstBlocker(m);if(q)return q}}
  return null;
}

let shown=S.coins,tw=0;
function tweenCoins(){

    if(shown===S.coins){$('coinTxt').textContent=shown;return}
    const diff=S.coins-shown;
    shown+=Math.sign(diff)*Math.max(1,Math.floor(Math.abs(diff)/6));
    $('coinTxt').textContent=shown;tw=requestAnimationFrame(stepFn);
  };

}

function tap(p){
  if(over||!pieces.includes(p))return;
  ac();clearHints();

    SFX.tick();p.el.classList.remove('bad');void p.el.offsetWidth;p.el.classList.add('bad');return;

function repair(p){

function dust(p,n){
  const r=p.el.getBoundingClientRect();
  const rx=p.h?(p.d>0?r.left:r.right):r.left+r.width/2;
  const ry=p.h?r.top+r.height/2:(p.d>0?r.top:r.bottom);
  const ang=p.h?(p.d>0?Math.PI:0):(p.d>0?-Math.PI/2:Math.PI/2);
  spawn(rx,ry,n,{angle:ang,spread:1.3,speed:2.2,size:6,life:20,colors:['#e8ecf5','#b9c2d6','#8d97ad']});
}
function launch(p){
  pieces=pieces.filter(q=>q!==p);cleared++;
  const dist=(p.h?(p.d>0?N-p.x:p.x+p.len):(p.d>0?N-p.y:p.y+p.len))*cell;
  p.el.style.transform=p.h?`translateX(${p.d*dist}px)`:`translateY(${p.d*dist}px)`;
  const [cx,cy]=centerOf(p.el);
  dust(p,8);[1,2,3].forEach(i=>setTimeout(()=>dust(p,4),i*90));
  const n=p.kind==='vip'?3:1;
  if(p.kind==='vip'){SFX.vip();vib([10,20,10])}
  for(let i=0;i<n;i++)setTimeout(()=>flyCoin(cx,cy),i*90);
  S.coins+=n;ensureWeekly();S.weekly.contrib++;track('clear',1);
  setTimeout(()=>p.el.remove(),550);
}
function go(p){

    spawn(b.left+b.width/2,b.top+b.height/2,30,{speed:6,size:8,life:36,g:.1,colors:['#4dd2ff','#ffd23f','#7cff6b','#4db8ff']});
  }

}
function fail(p,q){

        setTimeout(()=>{$('ov').style.display='none';lives=1;over=false;hud();SFX.buy()},adMs());

function dailyText(){
  const D=S.daily,sq=[...(D.log||'')].map(c=>c==='g'?'🟩':'🟥'),rows=[];
  for(let i=0;i<sq.length;i+=10)rows.push(sq.slice(i,i+10).join(''));
  return 'Cidade Bus Jam · Diário #'+dailyNum()+'\n'+'⭐'.repeat(D.stars||1)+' · '+D.errs+' erro(s) · '+D.attempts+' tentativa(s)\n'+rows.join('\n');
}
function dailyCanvas(){
  const D=S.daily,log=[...(D.log||'')],cols=10,cs=22,pd=20,rows=Math.max(1,Math.ceil(log.length/cols));
  const c=C(pd*2+cols*cs,120+rows*cs+30),g=c.getContext('2d');
  g.fillStyle='#1b2a55';g.fillRect(0,0,c.width,c.height);
  g.fillStyle='#ffd23f';g.font="bold 15px 'Press Start 2P',monospace";g.fillText('CIDADE BUS JAM',pd,36);
  g.fillStyle='#fff';g.font="11px 'Press Start 2P',monospace";
  g.fillText('DIÁRIO #'+dailyNum(),pd,62);
  g.fillText((D.stars||1)+' ESTRELA(S) · '+D.errs+' ERRO(S)',pd,86);
  log.forEach((ch,i)=>{
    g.fillStyle=ch==='g'?'#4fd13f':'#ff4d6d';
    g.fillRect(pd+(i%cols)*cs+1,110+Math.floor(i/cols)*cs+1,cs-3,cs-3);
  });
  return c;
}
function copyText(t){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).catch(()=>{});return}
    const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();
  }catch(e){}
}
async function shareDaily(){
  const text=dailyText();
  try{
    const blob=await new Promise(r=>dailyCanvas().toBlob(r));
    const file=new File([blob],'bus-jam-diario.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({text,files:[file]});return}
    if(navigator.share){await navigator.share({text});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  copyText(text);
  const [x,y]=[innerWidth/2,innerHeight/2];floatText(x,y,'RESULTADO COPIADO!','#7cff6b');
}

  if(!D.done){
    D.done=true;first=true;D.errs=errs;D.stars=stars;D.log=dlog;
    const t=todayStr(),gap=D.lastDone?Math.round((new Date(t+'T00:00:00')-new Date(D.lastDone+'T00:00:00'))/864e5):99;

let cityBase=null,cityCv=null,cityEnt={w:[],c:[]},cityT=0;
function drawCity(){
  const cols=4,n=S.city.length,rows=Math.max(3,Math.ceil((n+1)/cols));
  const c=C(cols*16,rows*16+4),g=c.getContext('2d');
  let seed=11;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    R(g,x*16,y*16,16,16,(x+y)%2?'#58b368':'#4fa860');
    for(let i=0;i<6;i++)R(g,x*16+Math.floor(rnd()*15),y*16+Math.floor(rnd()*15),1,1,'#6fcb7f');
    if(rnd()<.35)R(g,x*16+Math.floor(rnd()*14),y*16+Math.floor(rnd()*14),1,1,rnd()<.5?'#ffd23f':'#ff7ab0');
  }
  for(let i=0;i<rows*cols;i++){
    const x=(i%cols)*16,y=Math.floor(i/cols)*16;
    if(i<n){R(g,x+2,y+14,12,1,'#2f7d45');g.drawImage(BCAN[S.city[i]],x,y)}
    else{R(g,x+3,y+3,10,10,'#7a5f33');R(g,x+4,y+4,8,8,'#a98853')}
  }
  R(g,0,rows*16,cols*16,4,'#4b5168');
  for(let x=2;x<cols*16;x+=8)R(g,x,rows*16+2,4,1,'#f4f4f4');
  cityBase=c;
  const kc=Math.max(3,Math.min(7,Math.floor((Math.min(innerWidth,480)-28-24)/64)));
  const cv=C(c.width,c.height);
  cv.style.width=cols*16*kc+'px';cv.style.height=(rows*16+4)*kc+'px';cv.id='cityCv';
  cityCv=cv;const w=$('cityWrap');w.innerHTML='';w.appendChild(cv);
  const usedRows=Math.max(1,Math.ceil(n/cols)),pal=['#e63946','#4db8ff','#ffd23f','#c77dff','#ffffff'];
  cityEnt.w=[];
  for(let i=0;i<Math.min(10,n*2);i++)cityEnt.w.push({x:Math.random()*cols*16,y:Math.floor(Math.random()*usedRows)*16+12,v:(Math.random()<.5?-1:1)*(.12+Math.random()*.15),c:pal[i%5],ph:Math.random()*10});
  cityEnt.c=[{x:5,v:.5,c:'#ffd23f'},{x:40,v:-.4,c:'#4db8ff'}];
  cityFrame(0);
}
function cityFrame(t){
  if(!cityCv||!cityBase)return;
  const g=cityCv.getContext('2d');g.drawImage(cityBase,0,0);
  const W=cityBase.width,rows=(cityBase.height-4)/16;
  cityEnt.w.forEach(p=>{
    p.x+=p.v;if(p.x<0||p.x>W-2)p.v=-p.v;
    const fx=Math.round(p.x),fy=Math.round(p.y),st=Math.floor(t/4+p.ph)%2;
    R(g,fx,fy-4,2,2,'#ffd9b0');R(g,fx,fy-2,2,2,p.c);R(g,fx+(st?0:1),fy,1,1,'#333');
  });
  cityEnt.c.forEach(c=>{
    c.x+=c.v;if(c.x>W+8)c.x=-8;if(c.x<-8)c.x=W+8;
    const y=rows*16+1,x=Math.round(c.x);
    R(g,x,y,7,2,c.c);R(g,x+1,y-1,4,1,c.c);R(g,x+1,y+2,1,1,'#111');R(g,x+5,y+2,1,1,'#111');
  });
}

  $('shop').innerHTML=sh;

}

  cloudSync();cloudBoardLoad();setInterval(cloudSync,60000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){cloudSync()}});
}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
